<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="snapYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="snapGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ghost body (Snapchat-style) sans visage -->
  <g filter="url(#snapGlow)">
    <path
      d="M60 18
         C42 18 32 32 32 50
         C32 60 30 66 24 72
         C20 76 18 80 22 84
         C26 88 32 86 36 88
         C40 90 42 94 48 96
         C52 98 56 102 60 102
         C64 102 68 98 72 96
         C78 94 80 90 84 88
         C88 86 94 88 98 84
         C102 80 100 76 96 72
         C90 66 88 60 88 50
         C88 32 78 18 60 18 Z"
      fill="url(#snapYellow)"
    />
  </g>

  <!-- Plus badge -->
  <g transform="translate(82 78)">
    <circle cx="14" cy="14" r="16" fill="#0a0a0a" stroke="#FACC15" stroke-width="2.5"/>
    <rect x="12" y="6" width="4" height="16" rx="1.5" fill="#FACC15"/>
    <rect x="6" y="12" width="16" height="4" rx="1.5" fill="#FACC15"/>
  </g>
</svg>
